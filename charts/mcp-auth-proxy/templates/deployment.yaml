apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcp-auth-proxy.fullname" . }}
  labels:
    {{- include "mcp-auth-proxy.labels" . | nindent 4 }}
spec:
  # One replica, and Recreate rather than RollingUpdate: the state is one
  # SQLite database plus the signing secret, both single-writer, so two pods
  # must never hold /data at once — not even for the overlap of a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mcp-auth-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.extraCACerts }}
        checksum/ca: {{ .Values.extraCACerts | sha256sum }}
        {{- end }}
        {{- if and .Values.ntfy.enabled (not .Values.ntfy.existingSecret) }}
        checksum/ntfy: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mcp-auth-proxy.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mcp-auth-proxy.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup never changes the mount root's owner, so the state directory
        # is the volume root here and the process creates its files 0600.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 9090
              protocol: TCP
          {{- $ntfySecret := and .Values.ntfy.enabled .Values.ntfy.existingSecret }}
          {{- if or .Values.extraCACerts $ntfySecret }}
          env:
            {{- if .Values.extraCACerts }}
            # Go adds every file in these dirs to the system roots.
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/mcp-auth-proxy-ca
            {{- end }}
            {{- if $ntfySecret }}
            - name: MCP_PROXY_NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ntfy.existingSecret }}
                  key: {{ .Values.ntfy.existingSecretKey }}
            - name: MCP_PROXY_NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ntfy.existingSecret }}
                  key: {{ .Values.ntfy.existingSecretTokenKey }}
                  optional: true
            {{- end }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "mcp-auth-proxy.fullname" . }}
            {{- if and .Values.ntfy.enabled (not .Values.ntfy.existingSecret) }}
            - secretRef:
                name: {{ include "mcp-auth-proxy.fullname" . }}-ntfy
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/mcp-auth-proxy
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            {{- if .Values.extraCACerts }}
            - name: extra-ca
              mountPath: /etc/mcp-auth-proxy-ca
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.extraCACerts }}
        - name: extra-ca
          configMap:
            name: {{ include "mcp-auth-proxy.fullname" . }}-ca
        {{- end }}
        - name: config
          configMap:
            name: {{ include "mcp-auth-proxy.fullname" . }}
        - name: data
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "mcp-auth-proxy.fullname" . }}-data
          {{- end }}
