{{- if and .Values.httpRoute.enabled .Values.httpRoute.httpsRedirect.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-auth-proxy.fullname" . }}-https-redirect
  labels:
    {{- include "mcp-auth-proxy.labels" . | nindent 4 }}
spec:
  {{- if not .Values.httpRoute.httpsRedirect.parentRefs }}{{ fail "httpRoute.httpsRedirect.parentRefs is required" }}{{ end }}
  parentRefs:
    {{- range .Values.httpRoute.httpsRedirect.parentRefs }}
    - {{ toYaml (merge (dict) . (dict "group" "gateway.networking.k8s.io" "kind" "Gateway")) | indent 6 | trim }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
