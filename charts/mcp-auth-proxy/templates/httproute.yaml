{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mcp-auth-proxy.fullname" . }}
  labels:
    {{- include "mcp-auth-proxy.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.httpRoute.parentRefs }}{{ fail "httpRoute.parentRefs is required" }}{{ end }}
  parentRefs:
    {{- range .Values.httpRoute.parentRefs }}
    {{- /* API-server defaults spelled out so GitOps diffs stay clean. */}}
    - {{ toYaml (merge (dict) . (dict "group" "gateway.networking.k8s.io" "kind" "Gateway")) | indent 6 | trim }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "mcp-auth-proxy.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
