{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-auth-proxy.fullname" . }}
  labels:
    {{- include "mcp-auth-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-auth-proxy.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
      {{- with .Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: ops
      {{- with .Values.networkPolicy.opsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
