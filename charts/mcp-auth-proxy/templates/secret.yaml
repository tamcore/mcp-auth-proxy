{{- if and .Values.ntfy.enabled (not .Values.ntfy.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-auth-proxy.fullname" . }}-ntfy
  labels:
    {{- include "mcp-auth-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The ntfy topic is credential-like, so it lives in a Secret and never in
  # the ConfigMap the rest of the configuration lives in.
  MCP_PROXY_NTFY_TOPIC: {{ required "ntfy.topic is required when ntfy.enabled is true" .Values.ntfy.topic | quote }}
{{- end }}
