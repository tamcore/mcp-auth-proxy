apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-auth-proxy.fullname" . }}
  labels:
    {{- include "mcp-auth-proxy.labels" . | nindent 4 }}
# A Secret, not a ConfigMap: upstream headers and OAuth client secrets in the
# config are credentials.
type: Opaque
stringData:
  config.yaml: |
{{ include "mcp-auth-proxy.configYAML" . | indent 4 }}
  MCP_PROXY_CONFIG: /etc/mcp-auth-proxy/config.yaml
