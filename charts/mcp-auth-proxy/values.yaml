# mcp-auth-proxy — single-replica stateful deployment.
#
# The proxy keeps one SQLite database and the HMAC signing secret, so it is
# stateful and single-writer: the chart runs exactly one replica against one
# PVC and does not expose a replica count.

image:
  repository: ghcr.io/tamcore/mcp-auth-proxy
  # tag defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  # Ops listener: /metrics, /healthz, /readyz. Never route it publicly; the
  # httpRoute and ingress only target the http port.
  opsPort: 9090

metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}

config:
  # Canonical public URL: used for approve/deny button URLs and the MCP URL
  # printed by `key create`. Required.
  baseURL: ""
  listenAddr: "0.0.0.0:8080"
  sessionTTL: 8h
  logLevel: info
  # Usernames of the instance. Users missing from the database get a single-use
  # invite link in the pod log on start. Required.
  users: []
  # Admins (subset of users) can disable users and mint invite links at /admin.
  admins: []
  audit:
    enabled: true
    log_responses: false
    retention: 720h
  # Upstream MCP servers, as YAML. Each entry has a name and exactly one of
  # url (streamable HTTP) or command (stdio).
  upstreams: []
  #   - name: echo
  #     command: ["mcp-auth-proxy", "dev-echo"]
  # Client-facing OAuth clients of the proxy's authorization server.
  oauthClients: []
  #   - client_id: claude
  #     name: Claude
  #     redirect_uris: ["https://claude.ai/api/mcp/callback"]

persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mcp-auth-proxy.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute, an alternative to the Ingress. TLS terminates at the
# referenced Gateway listener.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #   - name: my-gateway
  #     namespace: gateway-system
  #     sectionName: https
  hostnames: []

# Extra CA certificates (PEM) trusted for outgoing TLS to users' ntfy servers and upstreams,
# e.g. a private root CA. Added to the system roots, not replacing them.
extraCACerts: ""

resources: {}
#   requests: {cpu: 10m, memory: 32Mi}
#   limits: {memory: 128Mi}

podAnnotations: {}
podLabels: {}
